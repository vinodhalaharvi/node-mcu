# Local test broker for the node-mcu MQTT sketch.
# Anonymous access on the LAN — fine for a home test network.
# For real use, replace allow_anonymous with a password_file (see mosquitto_passwd).
listener 1883 0.0.0.0
allow_anonymous true

# Persist retained messages (incl. Home Assistant discovery configs) across restarts.
persistence true
persistence_location /mosquitto/data/
